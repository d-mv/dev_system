services:
  db:
    image: postgres:16.6
    container_name: db
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    volumes:
      - ${HOST_DATA_PATH}:/var/lib/postgresql/data
    networks:
      dev_network:
        ipv4_address: ${POSTGRES_HOST}

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - ${MONGO_PORT}:27017
    volumes:
      - ${HOST_DATA_PATH}:/data/db
    networks:
      dev_network:
        ipv4_address: ${MONGO_HOST}

  pgadmin4:
    image: elestio/pgadmin:latest
    container_name: pgadmin
    depends_on:
      - db
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 8080
    ports:
      - ${PGADMIN_EXTERNAL_PORT}:8080
    volumes:
      - ${PGADMIN_SERVERS}:/pgadmin4/servers.json
    networks:
      dev_network:
        ipv4_address: ${PGADMIN_HOST}

  metadata:
    image: salrashid123/gcemetadataserver:latest
    container_name: metadata
    restart: always
    ports:
      - ${METADATA_PORT}:8080
    volumes:
      - ${METADATA_CERTS_PATH}:/certs
      - ${METADATA_CONFIG_PATH}:/config.json
    tty: true
    command: [
      "-serviceAccountFile", "/certs/metadata-sa.json",
      "--configFile=/config.json",
      "-logtostderr",
      "-alsologtostderr",
      "-v", "5",
      "-interface", "0.0.0.0",
      "-port", ":8080"
    ]
    networks:
      dev_network:
        ipv4_address: ${METADATA_HOST}

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:505.0.0-emulators
    container_name: pubsub
    restart: always
    ports:
      - ${GCP_PUBSUB_PORT}:${GCP_PUBSUB_PORT}
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port", "0.0.0.0:${GCP_PUBSUB_PORT}", "--project=pubsub-system"]
    networks:
      dev_network:
        ipv4_address: ${GCP_PUBSUB_HOST}

  local:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: local
    restart: always
    depends_on:
      - db
      - metadata
      - pubsub
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: 3
          memory: 10G
        limits:
          cpus: 6
          memory: 20G
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      GCP_PUBSUB_HOST: ${GCP_PUBSUB_HOST}
      GCP_PUBSUB_PORT: ${GCP_PUBSUB_PORT}
      GCP_PUBSUB_PROJECT_ID: ${GCP_PUBSUB_PROJECT_ID}
      METADATA_HOST: ${METADATA_HOST}
      METADATA_PORT: ${METADATA_PORT}
      GCE_METADATA_HOST: ${GCE_METADATA_HOST}
      ENV: 'dev:local'
    ports:
      - 5678:5678
      - 5679:5679
      - 5680:5680
      - 5681:5681
      - 5682:5682
      # - 5683:5683
      # - 5684:5684
      - 5685:5685
      - 5686:5686
      - 5687:5687
      - 5688:5688
      - 5689:5689
      # - 5690:5690
    volumes:
      - ${HOST_CODE_PATH}:/root/code
      - ${HOST_SSH_PATH}:/root/.ssh
      - ${GIT_CONFIG}:/root/.gitconfig
      
    tty: true
    networks:
      dev_network:
        ipv4_address: ${LOCAL_HOST}
  
